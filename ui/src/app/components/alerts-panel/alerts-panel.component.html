<article class="glass-panel dashboard-block">
  <div class="alerts-head">
    <h3 class="section-title">Alerts Panel</h3>
    <button type="button" class="refresh-btn" (click)="refresh.emit()" [disabled]="loading()">
      {{ loading() ? 'Refreshing...' : 'Refresh' }}
    </button>
  </div>

  <div class="alerts-panel">
    @for (alert of alerts(); track alert.timestamp) {
      <article class="alert-row">
        <div>
          <p class="alert-id">{{ alert.userId }}</p>
          <p class="alert-customer">{{ alert.timestamp | date: 'medium' }}</p>
        </div>
        <div class="alert-meta">
          <span class="score-pill" [class]=" 'score-pill ' + getLevelClass(alert.riskLevel)">{{ alert.riskScore }}</span>
          <p>{{ alert.riskLevel }} Risk</p>
        </div>
      </article>
    }
  </div>
</article>
